services:
  - type: web
    name: bloxupgrader
    runtime: node
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    disk:
      name: bloxupgrader-data
      mountPath: /var/data/bloxupgrader
      sizeGB: 5
    scaling:
      minInstances: 1
      maxInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: SITE_URL
        value: https://bloxupgrader.com
      - key: DATA_DIR
        value: /var/data/bloxupgrader
      - key: SUPABASE_URL
        value: https://xswjrolcyhzziehtnhnx.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SESSION_TOKEN_SECRET
        sync: false
      - key: ALLOW_DYNAMIC_ADMINS
        value: "0"
      - key: FORCE_FULL_RESET_ONCE
        value: "2026-09-19-blox-v2"
